<!DOCTYPE html>
<html lang="es">
  <head>
    <!-- Documento base: las secciones se insertan desde pages/ con main.js. -->

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Mecatronix Hub, homenaje de la Promoción 2026." />
    <title>Mecatronix Hub | Promoción 2026</title>

    <!-- Tipografías para la identidad tecnológica y legible del sitio. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet" />

    <!-- Capas globales, de estructura y de componentes. -->
    <link rel="stylesheet" href="css/variables.css" />
    <link rel="stylesheet" href="css/reset.css" />
    <link rel="stylesheet" href="css/global.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/navbar.css" />
    <link rel="stylesheet" href="css/hero.css" />
    <link rel="stylesheet" href="css/dashboard.css" />
    <link rel="stylesheet" href="css/professor.css" />
    <link rel="stylesheet" href="css/projects.css" />
    <link rel="stylesheet" href="css/gallery.css" />
    <link rel="stylesheet" href="css/timeline.css" />
    <link rel="stylesheet" href="css/messages.css" />
    <link rel="stylesheet" href="css/letter.css" />
    <link rel="stylesheet" href="css/footer.css" />
    <link rel="stylesheet" href="css/animations.css" />
    <link rel="stylesheet" href="css/responsive.css" />
  </head>
  <body>
    <!-- Cabecera persistente: los módulos del contenido se cargan abajo. -->
    <header class="site-header" id="top">
      <a class="brand" href="#top" aria-label="Ir al inicio de Mecatronix Hub">
        <span class="brand-mark" aria-hidden="true">MH</span>
        <span>Mecatronix <strong>Hub</strong></span>
      </a>
      <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="primary-navigation">
        <span class="sr-only">Abrir menú</span><span aria-hidden="true">☰</span>
      </button>
      <nav class="primary-navigation" id="primary-navigation" aria-label="Navegación principal">
        <a href="#home">Inicio</a><a href="#dashboard">Dashboard</a><a href="#professor">Profesor</a>
        <a href="#gallery">Galería</a><a href="#timeline">Recorrido</a><a href="#letter">Carta final</a>
      </nav>
    </header>

    <!-- Contenedor principal: cada sección conserva su archivo HTML independiente. -->
    <main id="app-content" aria-live="polite">
      <!-- main.js inserta hero, dashboard, professor, projects, gallery, timeline, messages y letter. -->
      <p class="loading-message">Preparando Mecatronix Hub…</p>
    </main>

    <!-- Contenedor independiente para el pie de página. -->
    <div id="footer-slot"></div>

    <!-- Punto de entrada de los módulos JavaScript. -->
    <script type="module" src="js/main.js"></script>
  </body>
</html>
